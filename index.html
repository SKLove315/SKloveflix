<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemoryFlix</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#141414;
  color:white;
  overflow-x:hidden;
}

.hidden{
  display:none;
}

/* LOADER */

#loader{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:10000;
  animation:hideLoader 4s forwards;
}

.netflix-intro span{
  font-size:120px;
  font-weight:bold;
  color:#e50914;
  animation:netflixZoom 3s ease forwards;
}

@keyframes netflixZoom{
  0%{
    opacity:0;
    transform:scale(0.2);
  }

  60%{
    opacity:1;
    transform:scale(1.1);
  }

  100%{
    opacity:1;
    transform:scale(1);
  }
}

@keyframes hideLoader{
  0%,90%{
    opacity:1;
    visibility:visible;
  }

  100%{
    opacity:0;
    visibility:hidden;
  }
}

/* LOGIN */

#login-screen{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:9999;
}

#login-screen h1{
  color:#e50914;
  font-size:60px;
  margin-bottom:20px;
}

#password{
  width:280px;
  padding:14px;
  border:none;
  border-radius:5px;
  margin-bottom:15px;
}

#login-btn{
  padding:12px 28px;
  background:#e50914;
  color:white;
  border:none;
  border-radius:5px;
  cursor:pointer;
}

#error{
  color:red;
  margin-top:15px;
}

/* PROFILES */

#profile-screen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

#profile-screen h1{
  margin-bottom:40px;
  font-size:50px;
}

.profiles{
  display:flex;
  gap:40px;
  flex-wrap:wrap;
  justify-content:center;
}

.profile{
  text-align:center;
  cursor:pointer;
  transition:0.3s;
}

.profile:hover{
  transform:scale(1.08);
}

.profile img{
  width:160px;
  height:160px;
  object-fit:cover;
  border-radius:10px;
}

.profile p{
  margin-top:12px;
  font-size:20px;
}

/* HERO */

.hero{
  height:100vh;
  background:url('images/banner.jpg');
  background-size:cover;
  background-position:center;
  position:relative;
  display:flex;
  align-items:center;
  padding-left:60px;
}

.hero::after{
  content:'';
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.6);
}

.hero-content{
  position:relative;
  z-index:2;
}

.hero-content h1{
  font-size:60px;
  margin-bottom:20px;
}

.watch-btn{
  padding:14px 28px;
  background:#e50914;
  border:none;
  color:white;
  border-radius:5px;
  cursor:pointer;
}

.section{
  padding:40px;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:20px;
}

.gallery img{
  width:100%;
  height:340px;
  object-fit:cover;
  border-radius:10px;
  transition:0.3s;
  cursor:pointer;
}

.gallery:hover img{
  opacity:0.4;
  filter:blur(3px);
}

.gallery img:hover{
  opacity:1 !important;
  filter:none !important;
  transform:scale(1.06);
}

/* POPUP */

#popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:99999;
}

#popup img{
  max-width:90%;
  max-height:90%;
  border-radius:12px;
}

#close-popup{
  position:absolute;
  top:20px;
  right:30px;
  font-size:45px;
  cursor:pointer;
}

/* MOBILE NAV */

.mobile-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#111;
  display:none;
  justify-content:space-around;
  padding:12px;
}

.mobile-nav button{
  background:none;
  border:none;
  color:white;
  font-size:28px;
}

@media(max-width:768px){

  .mobile-nav{
    display:flex;
  }

  body{
    padding-bottom:80px;
  }

  .hero-content h1{
    font-size:42px;
  }

  .gallery{
    grid-template-columns:repeat(2,1fr);
  }

  .gallery img{
    height:220px;
  }
}

</style>
</head>

<body>

<div id="loader">
  <div class="netflix-intro">
    <span>M</span>
  </div>
</div>

<div id="login-screen">

  <h1>MEMORYFLIX</h1>

  <input type="password" id="password" placeholder="Enter Password">

  <button id="login-btn">Enter</button>

  <p id="error"></p>

</div>

<div id="profile-screen" class="hidden">

  <h1>Who's Watching?</h1>

  <div class="profiles">

    <div class="profile" onclick="openProfile('first-meet','First Meet')">
      <img src="images/profiles/firstmeet.png">
      <p>First Meet</p>
    </div>

    <div class="profile" onclick="openProfile('us','US')">
      <img src="images/profiles/us.png">
      <p>US</p>
    </div>

    <div class="profile" onclick="openProfile('best-memos','Best Memos')">
      <img src="images/profiles/memos.png">
      <p>Best Memos</p>
    </div>

  </div>

</div>

<div id="website" class="hidden">

  <section class="hero">

    <div class="hero-content">

      <h1 id="profile-title">MemoryFlix ❤️</h1>

      <button class="watch-btn" onclick="scrollToGallery()">
        Watch Memories
      </button>

    </div>

  </section>

  <section class="section">

    <h2 id="gallery-heading"></h2>

    <div id="gallery" class="gallery"></div>

  </section>

</div>

<div id="popup" class="hidden">

  <span id="close-popup">&times;</span>

  <img id="popup-img">

</div>

<div class="mobile-nav">

  <button onclick="scrollToTop()">🏠</button>

  <button onclick="scrollToGallery()">🎬</button>

  <button onclick="backToProfiles()">👤</button>

</div>

<script>

const PASSWORD = "31507";

const profileData = {

  "first-meet":[
    "images/first-meet/1.jpg",
    "images/first-meet/2.jpg"
  ],

  "us":[
    "images/us/1.jpg",
    "images/us/2.jpg"
  ],

  "best-memos":[
    "images/best-memos/1.jpg",
    "images/best-memos/2.jpg"
  ]

};

window.addEventListener("load",()=>{

  setTimeout(()=>{

    document.getElementById("loader").style.display="none";

  },4000);

});

document.getElementById("login-btn")
.addEventListener("click",()=>{

  const enteredPassword =
    document.getElementById("password").value;

  if(enteredPassword === PASSWORD){

    document.getElementById("login-screen")
      .classList.add("hidden");

    document.getElementById("profile-screen")
      .classList.remove("hidden");

  }else{

    document.getElementById("error")
      .innerText = "Wrong password!";

  }

});

function openProfile(folder,title){

  document.getElementById("profile-screen")
    .classList.add("hidden");

  document.getElementById("website")
    .classList.remove("hidden");

  document.getElementById("profile-title")
    .innerText = title;

  document.getElementById("gallery-heading")
    .innerText = title;

  const gallery =
    document.getElementById("gallery");

  gallery.innerHTML = "";

  profileData[folder].forEach(image => {

    const img = document.createElement("img");

    img.src = image;

    gallery.appendChild(img);

  });

}

function backToProfiles(){

  document.getElementById("website")
    .classList.add("hidden");

  document.getElementById("profile-screen")
    .classList.remove("hidden");

}

function scrollToGallery(){

  window.scrollTo({
    top:window.innerHeight,
    behavior:"smooth"
  });

}

function scrollToTop(){

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

const popup =
  document.getElementById("popup");

const popupImg =
  document.getElementById("popup-img");

document.addEventListener("click",(e)=>{

  if(e.target.tagName === "IMG" &&
     e.target.parentElement.id !== "popup"){

    popup.classList.remove("hidden");

    popupImg.src = e.target.src;

  }

});

document.getElementById("close-popup")
.addEventListener("click",()=>{

  popup.classList.add("hidden");

});

const heroImages = [
  "images/banner.jpg",
  "images/first-meet/1.jpg",
  "images/us/1.jpg"
];

let currentHero = 0;

setInterval(()=>{

  currentHero++;

  if(currentHero >= heroImages.length){

    currentHero = 0;

  }

  document.querySelector(".hero")
    .style.backgroundImage =
      `url('${heroImages[currentHero]}')`;

},4000);

</script>

</body>
</html>
